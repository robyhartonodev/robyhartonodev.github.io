<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – Roby Hartono</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico">
<style>
:root { --bg: #fbfbfa; --text: #1c1e21; --muted: #545b63; --accent: #0b5fa5; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1216; --text: #e6e8eb; --muted: #a3aab3; --accent: #6cb2ff; }
}
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  background: var(--bg); color: var(--text); padding: 16px; box-sizing: border-box;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  text-align: center; line-height: 1.6;
}
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); }
h1 { font-size: 1.5rem; margin: 8px 0; }
a { color: var(--accent); }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <code>404 Not Found</code>
  <h1>Page not found · Seite nicht gefunden</h1>
  <p><a href="/">Back to the homepage · Zur Startseite</a></p>
</main>
</body>
</html>
